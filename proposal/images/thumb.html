<!doctype html>
<html><head><meta charset="utf-8">
<style>
  * { box-sizing:border-box; margin:0; }
  body { width:1500px; height:1000px; background:#f6f3ec; color:#17191c; font-family:-apple-system,"Helvetica Neue",Arial,sans-serif; padding:110px 110px 0; overflow:hidden; }
  h1 { font-size:190px; letter-spacing:-0.035em; font-weight:700; line-height:0.95; }
  .rule { height:6px; background:#17191c; margin:54px 0 46px; }
  .row { display:grid; grid-template-columns: 470px 60px 400px 1fr; align-items:baseline; font-size:44px; margin-bottom:34px; white-space:nowrap; }
  .file { font-family:ui-monospace,Menlo,monospace; font-size:36px; color:#5d646c; }
  .arrow { color:#5d646c; }
  .name { font-weight:650; }
  .does { color:#1f6f5c; font-weight:650; text-align:right; }
  .foot { position:absolute; left:110px; bottom:84px; font-size:44px; color:#5d646c; }
</style></head><body>
  <h1>Model Shelf</h1>
  <div class="rule"></div>
  <div class="row"><span class="file">final_v2.gguf</span><span class="arrow">is</span><span class="name">Tiny Lantern 1B</span><span class="does">chats and writes</span></div>
  <div class="row"><span class="file">model.safetensors</span><span class="arrow">is</span><span class="name">Pier Sketch XL</span><span class="does">makes images</span></div>
  <div class="foot">Type a job. Find the AI model for it on your NAS.</div>
</body></html>
